<div class="mb-4">
  <h2 class="text-success">
        Sign Up
  </h2>
  <div> Already have an account?
    <a routerLink="/signin" class="text-decoration-none fw-medium text-success d-inline-block">
      Sign In
    </a>
  </div>
</div>
<form [formGroup] = "form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
        <input class="form-control bg-body-secondary" placeholder="Full Name" formControlName ="fullName">
        <div class="error-feedback" *ngIf = "hasDisplayableError('fullName') && form.controls.fullName.hasError('required')">
            Please enter your full name
        </div>
    </div>
    <div class="mb-3">
        <input class="form-control bg-body-secondary" placeholder="Email" formControlName ="email">
        <div class="error-feedback"
        *ngIf = "hasDisplayableError('email')">
            <div  *ngIf = "form.controls.email.hasError('required')">
                Please enter your email
            </div>
            <div  *ngIf = "form.controls.email.hasError('email')">
                Please enter a valid email
            </div>
        </div>
    </div>
  <div class="mb-3">
  <select class="form-select bg-body secondary" formControlName="role">
    <option value="" disabled selected>Choose role</option>
    <option *ngFor="let role of ROLES" [value]="role">
      {{role}}
    </option>
  </select>
  </div>
  <div class="mb-3">
    <select class="form-select bg-body secondary" formControlName="gender">
      <option value="" disabled>Choose gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>
  </div>
  <div class="mb-3">
    <input
      type="date"
      class="form-control bg-body-secondary"
      formControlName="dateOfBirth"
    />
  </div>
  <div class="mb-3">
    <input
      class="form-control bg-body-secondary"
      formControlName="age"
      placeholder="Age"
      readonly
    />
  </div>
    <div class="mb-3">
  <input
    class="form-control bg-body-secondary"
    placeholder="Password"
    formControlName="password"
    type="password"
  />
  <div class="error-feedback" *ngIf="hasDisplayableError('password')">
    <ng-container [ngSwitch]="form.controls.password.errors | firstKey">
      <div *ngSwitchCase="'required'">
        Please enter password
      </div>
      <div *ngSwitchCase="'minlength'">
        Please enter a valid password (at least 8 characters)
      </div>
    </ng-container>
  </div>
</div>
    <div class="mb-3">
        <input class="form-control bg-body-secondary" placeholder="Confirm Password"
               formControlName ="confirmPassword">
         <div class="error-feedback"
              *ngIf = "hasDisplayableError('confirmPassword') && form.controls.confirmPassword.hasError('passwordMisMatch')">
            Passwords don't match
        </div>
    </div>
    <div class="mt-4">
        <button type="submit" class="btn btn-success w-100 rounded-3">
            Register
        </button>
    </div>
</form>
